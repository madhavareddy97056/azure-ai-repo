name: Deploy Azure OpenAI with Terraform

on:
  push: # pull_request
    branches:
      - test
    # types:
    #    - closed
 
  #workflow_dispatch:  # Allows manual trigger

permissions:
  id-token: write
  contents: read

jobs:
  Deploy_Azure_AI_services:
    name: 'Provisioning Azure AI services using terraform'
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az version

      # Login to Azure using OIDC (Recommended)
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Set Terraform Authentication Environment Variables
      - name: Set Terraform Azure Credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.3

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init #-backend-config="resource_group_name=tf-backend-remote-state-rg" -backend-config="storage_account_name=tfbackendstorageacct" -backend-config="container_name=remotestate"

      # Plan Terraform deployment
      - name: Terraform Plan
        run: terraform plan

  manual-approval:
    name: Manual approval
    runs-on: ubuntu-latest
    needs: Deploy_Azure_AI_services
    if: success()


    permissions:
      issues: write

    steps: 
      - name: Waiting for Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: madhavareddy97056
          minimum-approvals: 1
          issue-title: "Manual approval required to deploy Azure services"
          issue-body: "Please approve or deny the deployment"

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az version

      # Login to Azure using OIDC (Recommended)
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Set Terraform Authentication Environment Variables
      - name: Set Terraform Azure Credentials
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.3

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init #-backend-config="resource_group_name=tf-backend-remote-state-rg" -backend-config="storage_account_name=tfbackendstorageacct" -backend-config="container_name=remotestate"

      # Apply Terraform configuration
      - name: Terraform Apply
        run: terraform apply -auto-approve
